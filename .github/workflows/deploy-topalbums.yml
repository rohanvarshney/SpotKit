name: Deploy SpotKit Suite to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (from locked SESH/frontend) and build SESH
        working-directory: ./SESH/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build TopAlbums
        run: |
          ln -sfn ../SESH/frontend/node_modules TopAlbums/node_modules
          cd TopAlbums
          npm run build

      - name: Build DJMyPlaylist
        run: |
          ln -sfn ../SESH/frontend/node_modules DJMyPlaylist/node_modules
          cd DJMyPlaylist
          npm run build

      - name: Build MakeASet
        run: |
          ln -sfn ../SESH/frontend/node_modules MakeASet/node_modules
          cd MakeASet
          npm run build

      - name: Stage SpotKit Hub and all 4 tools
        run: |
          mkdir -p _site/TopAlbums _site/SESH _site/DJMyPlaylist _site/MakeASet
          cp index.html LICENSE NOTICE _site/
          cp -R assets _site/assets
          cp -R TopAlbums/dist/* _site/TopAlbums/
          cp -R SESH/frontend/dist/* _site/SESH/
          cp -R DJMyPlaylist/dist/* _site/DJMyPlaylist/
          cp -R MakeASet/dist/* _site/MakeASet/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
